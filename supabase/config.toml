# supabase/config.toml — مركز الأحمدي للجوالات
# وثيقة: https://supabase.com/docs/guides/local-development

[api]
enabled     = true
port        = 54321
schemas     = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows    = 1000

[api.tls]
enabled = false

[db]
port        = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled     = false
port        = 54329
pool_mode   = "transaction"
default_pool_size = 20
max_client_conn   = 100

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[storage]
enabled   = true
file_size_limit = "52428800"  # 50MB

[storage.image_transformation]
enabled = true

[auth]
enabled        = true
site_url       = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3001",
  "http://localhost:3002",
]
jwt_expiry         = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10
enable_signup      = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup         = true
double_confirm_changes = true
enable_confirmations  = false  # في التطوير المحلي

[auth.sms]
enable_signup        = false
enable_confirmations = false
template = "رمز التحقق لمركز الأحمدي: {{ .Code }}"

[auth.external.google]
enabled  = false

[analytics]
enabled  = false

[functions]
verify_jwt = true
